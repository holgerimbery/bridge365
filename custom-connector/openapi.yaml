# OpenAPI (Swagger 2.0) definition for the SharedMailboxConnector custom connector.
# Import this file when creating the connector from OpenAPI (see README.md, Step 5.2).

swagger: "2.0"
info:
  title: SharedMailboxConnector
  description: Custom connector for the shared mailbox classification backend service.
  version: "1.0.0"
host: shared-mailbox-classifier.azurewebsites.net
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  azure_ad:
    type: oauth2
    flow: application
    tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes: {}
security:
  - azure_ad: []
paths:
  /api/mailbox/messages:
    get:
      summary: GetMessages
      operationId: GetMessages
      parameters:
        - name: mailboxAddress
          in: query
          required: true
          type: string
        - name: top
          in: query
          required: false
          type: integer
          default: 10
      responses:
        "200":
          description: Array of Message objects
  /api/mailbox/messages/{messageId}:
    get:
      summary: GetMessage
      operationId: GetMessage
      parameters:
        - name: messageId
          in: path
          required: true
          type: string
        - name: mailboxAddress
          in: query
          required: true
          type: string
      responses:
        "200":
          description: Single Message object
  /api/mailbox/classify:
    post:
      summary: ClassifyMessage
      operationId: ClassifyMessage
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              messageId:
                type: string
      responses:
        "200":
          description: Array of Classifications
  /api/mailbox/drafts:
    post:
      summary: CreateDraft
      operationId: CreateDraft
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              messageId:
                type: string
              subject:
                type: string
              body:
                type: string
              classifications:
                type: array
                items:
                  type: object
      responses:
        "200":
          description: "{ draftId, draftUrl }"
